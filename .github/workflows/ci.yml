name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "Объём проверки: BASIC или весь банк"
        type: choice
        options: [basic, full]
        default: basic

env:
  HOMEWORK_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'basic' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: check:dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Download and verify modules
        run: make deps-check
      - name: Check go.mod and go.sum
        run: make mod-check

  format:
    name: check:format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Check gofmt
        run: make fmt-check

  vet:
    name: check:vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Run go vet
        run: make vet

  unit-tests:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Run unit tests
        run: |
          if [ "$HOMEWORK_PROFILE" = full ]; then make test-unit; else make test-basic; fi

  integration-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
    name: test:integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Run integration tests
        run: make test-integration

  race-tests:
    name: test:race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Run race tests
        run: |
          if [ "$HOMEWORK_PROFILE" = full ]; then make test-race; else make test-basic-race; fi

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
    name: test:coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Check coverage threshold
        run: make coverage-check
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  build:
    name: build:binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Build all examples
        run: make build

  package:
    name: cd:package-artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
    needs:
      - dependencies
      - format
      - vet
      - unit-tests
      - integration-tests
      - race-tests
      - coverage
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Package all binaries
        run: make package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: homework-go-2-linux-amd64
          path: bin/homework-go-2-linux-amd64.tar.gz
          if-no-files-found: error